<!doctype html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>KNDB2050 计划课转换成加课</title>

    <!-- Bootstrap core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .main-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 0;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .card-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            font-weight: bold;
            border-radius: 15px 15px 0 0 !important;
        }

        .card-header-preview {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            font-weight: bold;
            border-radius: 15px 15px 0 0 !important;
        }

        .section-label {
            font-weight: 600;
            color: #555;
        }

        .divider {
            border-top: 1px dashed #ccc;
            margin: 1.5rem 0;
        }

        .btn-execute {
            background: linear-gradient(45deg, #f7971e, #ffd200);
            border: none;
            border-radius: 25px;
            padding: 10px 40px;
            font-weight: 600;
            font-size: 1rem;
            color: #333;
            transition: all 0.3s ease;
        }

        .btn-execute:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(247, 151, 30, 0.4);
        }

        .btn-execute:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-cancel {
            border-radius: 25px;
            padding: 10px 40px;
            font-size: 1rem;
        }

        .preview-table th {
            background-color: #f0f4ff;
            white-space: nowrap;
        }

        #previewCard {
            display: none;
        }

        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }
    </style>
</head>

<body>
    <div class="main-header">
        <div class="container">
            <h2>KNDB2050 计划课转换成加课</h2>
            <p class="mb-0">将指定学生指定月份的计划课（lessonType=1）转换为加课（lessonType=2）</p>
        </div>
    </div>

    <div class="container">

        <!-- 执行结果消息 -->
        <div id="resultAlert" class="alert alert-dismissible fade show d-none" role="alert">
            <strong id="resultTitle"></strong> <span id="resultMessage"></span>
            <button type="button" class="close" data-dismiss="alert">
                <span>&times;</span>
            </button>
        </div>

        <!-- 条件入力区域 -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">执行条件</h5>
            </div>
            <div class="card-body">

                <!-- 学生 -->
                <div class="form-group row">
                    <label class="col-sm-3 col-form-label section-label">学生</label>
                    <div class="col-sm-6">
                        <select id="stuId" class="form-control">
                            <option value="">── 请选择学生 ──</option>
                            <option th:each="stu : ${studentList}"
                                    th:value="${stu.stuId}"
                                    th:text="${stu.stuId} + ' ' + ${stu.stuName}">
                            </option>
                        </select>
                    </div>
                </div>

                <!-- 科目 -->
                <div class="form-group row">
                    <label class="col-sm-3 col-form-label section-label">科目</label>
                    <div class="col-sm-6">
                        <select id="subjectId" class="form-control" disabled>
                            <option value="">── 请选择科目 ──</option>
                        </select>
                    </div>
                </div>

                <!-- 年度 / 月份 -->
                <div class="form-group row">
                    <label class="col-sm-3 col-form-label section-label">对象年月</label>
                    <div class="col-sm-3">
                        <select id="selectYear" class="form-control">
                            <option th:each="y : ${#numbers.sequence(currentYear - 2, currentYear + 1)}"
                                    th:value="${y}"
                                    th:text="${y} + '年'"
                                    th:selected="${y == currentYear}">
                            </option>
                        </select>
                    </div>
                    <div class="col-sm-3">
                        <select id="selectMonth" class="form-control">
                            <option th:each="m : ${#numbers.sequence(1, 12)}"
                                    th:value="${m}"
                                    th:text="${m} + '月'"
                                    th:selected="${m == currentMonth}">
                            </option>
                        </select>
                    </div>
                </div>

            </div>
        </div>

        <!-- 预览区域（条件全部选完后自动显示） -->
        <div class="card" id="previewCard">
            <div class="card-header card-header-preview">
                <h5 class="mb-0">
                    执行对象课程一览
                    <span id="previewSpinner" class="spinner-border spinner-border-sm ml-2 d-none" role="status"></span>
                </h5>
            </div>
            <div class="card-body">

                <!-- 状态消息 -->
                <div id="previewMessage" class="alert mb-3" role="alert"></div>

                <!-- 课程列表 -->
                <div id="previewTableWrapper" class="d-none">
                    <table class="table table-bordered table-sm preview-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>课程ID</th>
                                <th>上课日期</th>
                                <th>课费ID（转换前）</th>
                            </tr>
                        </thead>
                        <tbody id="previewTableBody">
                        </tbody>
                    </table>
                </div>

                <div class="divider"></div>

                <!-- 执行 / 取消 按钮 -->
                <div class="text-center">
                    <button type="button" id="btnExecute" class="btn btn-execute mr-3" disabled>
                        开始执行
                    </button>
                    <a href="/batch/job" class="btn btn-outline-secondary btn-cancel">
                        取消
                    </a>
                </div>

            </div>
        </div>

        <!-- 预览未显示时的取消按钮 -->
        <div id="cancelWrapper" class="text-center mb-4">
            <a href="/batch/job" class="btn btn-outline-secondary btn-cancel">
                取消（返回任务菜单）
            </a>
        </div>

    </div>

    <!-- 确认执行 Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" role="dialog" aria-labelledby="confirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content" style="border-radius: 12px; overflow: hidden;">
                <div class="modal-header" style="background: linear-gradient(135deg, #f7971e, #ffd200);">
                    <h5 class="modal-title font-weight-bold" id="confirmModalLabel">确认执行转换</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p class="text-muted mb-3">此操作将把计划课转换为加课，请确认参数无误后执行。</p>
                    <table class="table table-sm table-bordered">
                        <tbody>
                            <tr>
                                <th class="bg-light" style="width: 35%;">学生</th>
                                <td id="confirmStuName"></td>
                            </tr>
                            <tr>
                                <th class="bg-light">科目</th>
                                <td id="confirmSubjectId"></td>
                            </tr>
                            <tr>
                                <th class="bg-light">对象年月</th>
                                <td id="confirmYearMonth"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" id="btnConfirmExecute" class="btn btn-warning font-weight-bold">确认执行</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap core JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        // ===== 选择学生 → 取科目列表 =====
        $('#stuId').change(function () {
            var stuId = $(this).val();
            resetPreview();

            $('#subjectId').empty()
                .append('<option value="">── 请选择科目 ──</option>')
                .prop('disabled', true);

            if (!stuId) return;

            $.get('/kndb2050/subjects', { stuId: stuId }, function (data) {
                var $select = $('#subjectId').empty()
                    .append('<option value="">── 请选择科目 ──</option>');
                $.each(data, function (i, item) {
                    $select.append($('<option>').val(item.subjectId)
                        .text(item.subjectId + ' ' + item.subjectName));
                });
                $select.prop('disabled', false);
            }).fail(function () {
                alert('取得科目列表失败，请重试。');
            });
        });

        // ===== 选择科目 / 年度 / 月份 → 触发预览 =====
        $('#subjectId, #selectYear, #selectMonth').change(function () {
            checkAndLoadPreview();
        });

        // ===== 条件全部满足时自动触发预览 =====
        function checkAndLoadPreview() {
            var stuId     = $('#stuId').val();
            var subjectId = $('#subjectId').val();
            var year      = $('#selectYear').val();
            var month     = $('#selectMonth').val();

            if (!stuId || !subjectId || !year || !month) {
                resetPreview();
                return;
            }

            var yearMonth = year + '-' + String(parseInt(month)).padStart(2, '0');
            loadPreview(stuId, subjectId, yearMonth);
        }

        // ===== 执行预览查询 =====
        function loadPreview(stuId, subjectId, yearMonth) {
            $('#previewCard').show();
            $('#cancelWrapper').hide();
            $('#previewSpinner').removeClass('d-none');
            $('#previewTableWrapper').addClass('d-none');
            $('#previewTableBody').empty();
            $('#btnExecute').prop('disabled', true);
            $('#previewMessage').removeClass('alert-success alert-warning alert-info').text('');

            $.get('/kndb2050/preview',
                { stuId: stuId, subjectId: subjectId, yearMonth: yearMonth },
                function (data) {
                    renderPreview(data);
                }
            ).fail(function () {
                $('#previewMessage')
                    .removeClass('alert-success alert-warning')
                    .addClass('alert-danger')
                    .text('预览查询失败，请重试。');
            }).always(function () {
                $('#previewSpinner').addClass('d-none');
            });
        }

        // ===== 渲染预览结果 =====
        function renderPreview(data) {
            var $msg = $('#previewMessage');

            if (data.alreadyPaid) {
                $msg.removeClass('alert-success alert-info alert-danger')
                    .addClass('alert-warning')
                    .html('<strong>⚠️ 不能执行：</strong>' + data.message);
            } else if (!data.canExecute) {
                $msg.removeClass('alert-warning alert-success alert-danger')
                    .addClass('alert-info')
                    .html('<strong>ℹ️ </strong>' + data.message);
            } else {
                $msg.removeClass('alert-warning alert-info alert-danger')
                    .addClass('alert-success')
                    .html('<strong>✅ </strong>' + data.message);
            }

            if (data.targetList && data.targetList.length > 0) {
                var $tbody = $('#previewTableBody').empty();
                $.each(data.targetList, function (i, item) {
                    $tbody.append(
                        '<tr>'
                        + '<td>' + (i + 1) + '</td>'
                        + '<td>' + (item.lessonId || '') + '</td>'
                        + '<td>' + (item.schedualDate || '') + '</td>'
                        + '<td>' + (item.lsnFeeId || '') + '</td>'
                        + '</tr>'
                    );
                });
                $('#previewTableWrapper').removeClass('d-none');
            }

            $('#btnExecute').prop('disabled', !data.canExecute);
        }

        // ===== 开始执行按钮点击 → 弹出确认 Modal =====
        $('#btnExecute').click(function () {
            var stuId     = $('#stuId').val();
            var subjectId = $('#subjectId').val();
            var year      = $('#selectYear').val();
            var month     = $('#selectMonth').val();
            var yearMonth = year + '-' + String(parseInt(month)).padStart(2, '0');
            var stuName   = $('#stuId option:selected').text();

            // 填充确认 Modal
            $('#confirmStuName').text(stuName);
            $('#confirmSubjectId').text($('#subjectId option:selected').text());
            $('#confirmYearMonth').text(year + '年 ' + parseInt(month) + '月');

            $('#confirmModal').modal('show');
        });

        // ===== 确认执行 → AJAX 提交 =====
        $('#btnConfirmExecute').click(function () {
            $('#confirmModal').modal('hide');

            var stuId     = $('#stuId').val();
            var subjectId = $('#subjectId').val();
            var year      = $('#selectYear').val();
            var month     = $('#selectMonth').val();
            var yearMonth = year + '-' + String(parseInt(month)).padStart(2, '0');

            var $btn = $('#btnExecute');
            $btn.prop('disabled', true).text('执行中...');

            $.ajax({
                url: '/kndb2050/execute',
                type: 'POST',
                data: {
                    stuId: stuId,
                    subjectId: subjectId,
                    yearMonth: yearMonth
                },
                success: function (data) {
                    if (data.success) {
                        showResult('success', '执行成功', data.message);
                        resetAll();
                    } else {
                        showResult('danger', '执行失败', data.message);
                        $btn.prop('disabled', false).text('开始执行');
                    }
                },
                error: function () {
                    showResult('danger', '执行失败', '网络错误，请重试。');
                    $btn.prop('disabled', false).text('开始执行');
                }
            });
        });

        // ===== 辅助函数 =====
        function resetPreview() {
            $('#previewCard').hide();
            $('#cancelWrapper').show();
            $('#previewTableWrapper').addClass('d-none');
            $('#previewTableBody').empty();
            $('#btnExecute').prop('disabled', true).text('开始执行');
        }

        function resetAll() {
            resetPreview();
            $('#stuId').val('');
            $('#subjectId').empty()
                .append('<option value="">── 请选择科目 ──</option>')
                .prop('disabled', true);
        }

        function showResult(type, title, message) {
            var $alert = $('#resultAlert');
            $alert.removeClass('alert-success alert-danger d-none').addClass('alert-' + type);
            $('#resultTitle').text(title + '：');
            $('#resultMessage').text(message);
            $('html, body').animate({ scrollTop: 0 }, 400);
        }

    </script>
</body>

</html>
