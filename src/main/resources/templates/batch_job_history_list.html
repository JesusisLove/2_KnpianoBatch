<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>作业执行历史</title>

    <!-- Bootstrap core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .container-fluid {
            padding: 10px 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            margin: 8px 0;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            text-align: center;
        }

        .page-title h2 {
            margin: 0;
            font-weight: 700;
            font-size: 22px;
        }

        .nav-buttons {
            margin: 6px 0;
        }

        .nav-buttons .btn {
            margin-right: 10px;
        }

        .business-description {
            background: linear-gradient(135deg, #e0f7ff 0%, #b3e5fc 100%);
            border-radius: 8px;
            padding: 8px 15px;
            margin: 6px 0;
            box-shadow: 0 2px 8px rgba(0, 188, 212, 0.2);
        }

        .business-description p {
            margin: 0;
            font-size: 13px;
        }

        .upper-section {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
        }

        .lower-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .search-section {
            background: linear-gradient(135deg, #ffe0b2 0%, #ffcc80 100%);
            border-radius: 10px;
            padding: 12px 20px;
            margin: 6px 0;
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
        }

        .search-section .form-control {
            border-radius: 8px;
            border: 2px solid #ffb74d;
            background: white;
            transition: all 0.3s ease;
            padding: 6px 12px;
        }

        .search-section .form-control:focus {
            border-color: #ff9800;
            box-shadow: 0 0 0 0.2rem rgba(255, 152, 0, 0.25);
        }

        .btn-search {
            background: linear-gradient(45deg, #ff9800, #f57c00);
            border: none;
            color: white;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
        }

        .status-info-inline {
            background: linear-gradient(135deg, #e8f5e8 0%, #c8e6c9 100%);
            border-radius: 6px;
            padding: 5px 12px;
            border: 2px solid #4caf50;
            font-size: 12px;
            color: #2e7d32;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .status-info-inline.info {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-color: #2196f3;
            color: #1976d2;
        }

        .table-section {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            border-radius: 10px;
            padding: 12px;
            margin: 6px 0;
            box-shadow: 0 4px 12px rgba(255, 183, 77, 0.3);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .table-responsive {
            border-radius: 8px;
            overflow-x: auto;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-height: 0;
        }

        .styled-table {
            background: white;
            margin: 0;
            border: none;
            width: 100%;
            table-layout: auto;
        }

        .styled-table thead th {
            background: linear-gradient(135deg, #37474f 0%, #546e7a 100%);
            color: white;
            font-weight: 700;
            text-align: center;
            padding: 10px 6px;
            border: 1px solid #607d8b;
            font-size: 13px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .styled-table tbody tr {
            transition: all 0.2s ease;
        }

        .styled-table tbody tr:nth-child(even) {
            background: #f8f9fa;
        }

        .styled-table tbody tr:nth-child(odd) {
            background: white;
        }

        .styled-table tbody tr:hover {
            background: #fff3e0;
            transform: scale(1.01);
            box-shadow: 0 2px 8px rgba(255, 152, 0, 0.2);
        }

        .styled-table tbody td {
            padding: 6px 6px;
            vertical-align: middle;
            border-bottom: 1px solid #ffe0b2;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            word-wrap: break-word;
            max-width: 150px;
        }

        /* 状态颜色 */
        .status-completed {
            color: #4caf50;
            font-weight: bold;
        }

        .status-failed {
            color: #f44336;
            font-weight: bold;
        }

        .status-started {
            color: #ff9800;
            font-weight: bold;
        }

        .status-stopped {
            color: #9e9e9e;
            font-weight: bold;
        }

        .status-unknown {
            color: #607d8b;
            font-weight: bold;
        }

        .empty-data {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 30px;
            font-size: 18px;
        }

        .footer-info {
            margin-top: 10px;
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <!-- 上半部分 -->
        <div class="upper-section">
            <div class="page-title">
                <h2>作业执行历史</h2>
            </div>

            <div class="nav-buttons">
                <a href="/main.html" class="btn btn-secondary">返回主菜单</a>
                <a href="/batch/job" class="btn btn-info">作业配置管理</a>
                <a href="/batch/mail" class="btn btn-info">邮件配置管理</a>
            </div>

            <div class="business-description">
                <p><strong>业务说明：</strong>查看批处理作业的执行历史记录，包括执行ID、作业名、开始/结束时间、耗时、执行状态等信息</p>
            </div>

            <!-- 检索区域 -->
            <div class="search-section">
                <h6 class="mb-2" style="color: #e65100; font-weight: bold;">执行历史检索</h6>

                <div th:if="${historyList != null and !historyList.isEmpty()}" class="status-info-inline">
                    共 <strong th:text="${historyList.size()}">0</strong> 条执行记录
                </div>

                <div th:if="${historyList == null or historyList.isEmpty()}" class="status-info-inline info">
                    当前没有执行历史记录，作业执行后会自动记录
                </div>

                <form action="#" th:action="@{/batch/history/search}" method="get">
                    <div class="form-row align-items-center">
                        <div class="form-group col-md-2 mb-0">
                            <label for="searchYear" class="font-weight-bold mb-1">年：</label>
                            <select class="form-control" id="searchYear" name="searchYear"
                                th:data-selected="${searchYear}">
                            </select>
                        </div>
                        <div class="form-group col-md-2 mb-0">
                            <label for="searchMonth" class="font-weight-bold mb-1">月：</label>
                            <select class="form-control" id="searchMonth" name="searchMonth"
                                th:data-selected="${searchMonth}">
                            </select>
                        </div>
                        <div class="form-group col-md-3 mb-0">
                            <label for="jobName" class="font-weight-bold mb-1">作业名：</label>
                            <input type="text" class="form-control" id="jobName" name="jobName"
                                th:value="${searchJobName}" placeholder="留空查询全部">
                            <small class="form-text text-muted" style="margin-top: 2px;">留空则查询全部执行记录</small>
                        </div>
                        <div class="form-group col-md-2 mb-0">
                            <label class="d-block mb-1">&nbsp;</label>
                            <button type="submit" class="btn btn-search btn-block">
                                检索
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- 下半部分 -->
        <div class="lower-section">
            <div class="table-section">
                <h6 class="mb-1" style="color: #e65100; font-weight: bold;">执行记录明细</h6>
                <div class="table-responsive">
                    <table class="table table-striped table-sm styled-table">
                        <thead>
                            <tr>
                                <th width="7%">执行ID</th>
                                <th width="14%">作业名</th>
                                <th width="17%">开始时间</th>
                                <th width="5%">星期</th>
                                <th width="17%">结束时间</th>
                                <th width="9%">耗时</th>
                                <th width="10%">状态</th>
                                <th width="12%">退出码</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="record : ${historyList}" th:if="${historyList != null and !historyList.isEmpty()}">
                                <td>
                                    <strong th:text="${record.executionId}">ID</strong>
                                </td>
                                <td th:text="${record.jobName}">作业名</td>
                                <td th:text="${record.startTime != null ? #dates.format(record.startTime, 'yyyy-MM-dd HH:mm:ss') : '-'}">开始时间</td>
                                <td th:text="${record.dayOfWeek}">星期</td>
                                <td th:text="${record.endTime != null ? #dates.format(record.endTime, 'yyyy-MM-dd HH:mm:ss') : '-'}">结束时间</td>
                                <td th:text="${record.duration}">耗时</td>
                                <td>
                                    <span th:class="${record.statusClass}" th:text="${record.status}">状态</span>
                                </td>
                                <td th:text="${record.exitCode}">退出码</td>
                            </tr>
                            <tr th:if="${historyList == null or historyList.isEmpty()}">
                                <td colspan="8" class="empty-data">
                                    <div>
                                        <p style="font-size: 18px; margin-bottom: 10px;">暂无执行历史记录</p>
                                        <p style="color: #999;">批处理作业执行后，执行记录会自动显示在此处</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="text-center text-muted footer-info">
            <small>KNPiano 批处理管理系统 - 作业执行历史模块</small>
        </div>
    </div>

    <!-- Bootstrap core JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {
            var now = new Date();
            var currentYear = now.getFullYear();
            var currentMonth = now.getMonth() + 1;
            var startYear = 2025;

            // 从服务端获取已选值（0 = 全部）
            var rawYear = $('#searchYear').data('selected');
            var rawMonth = $('#searchMonth').data('selected');
            var selectedYear = (rawYear !== undefined && rawYear !== '') ? parseInt(rawYear) : currentYear;
            var selectedMonth = (rawMonth !== undefined && rawMonth !== '') ? parseInt(rawMonth) : currentMonth;

            // 生成年份下拉选项（全部 + 2025 ~ 当前年份）
            var yearSelect = $('#searchYear');
            var optAll = $('<option>').val(0).text('全部');
            if (selectedYear === 0) optAll.attr('selected', true);
            yearSelect.append(optAll);
            for (var y = currentYear; y >= startYear; y--) {
                var opt = $('<option>').val(y).text(y + '年');
                if (y === selectedYear) opt.attr('selected', true);
                yearSelect.append(opt);
            }

            // 生成月份下拉选项
            function buildMonthOptions(year, keepMonth) {
                var monthSelect = $('#searchMonth');
                monthSelect.empty();

                if (year === 0) {
                    // 年份"全部"→月份只有"全部"，且禁用
                    monthSelect.append($('<option>').val(0).text('全部'));
                    monthSelect.val(0);
                    monthSelect.prop('disabled', true);
                } else {
                    monthSelect.prop('disabled', false);
                    // 添加"全部"选项
                    monthSelect.append($('<option>').val(0).text('全部'));
                    for (var m = 1; m <= 12; m++) {
                        monthSelect.append($('<option>').val(m).text(m + '月'));
                    }
                    if (keepMonth !== undefined && keepMonth !== null) {
                        monthSelect.val(keepMonth);
                    } else if (year < currentYear) {
                        monthSelect.val(12);
                    } else {
                        monthSelect.val(currentMonth);
                    }
                }
            }

            // 初始化月份
            buildMonthOptions(selectedYear, selectedMonth);

            // 年份切换时联动月份
            yearSelect.on('change', function() {
                var chosenYear = parseInt($(this).val());
                if (chosenYear === 0) {
                    buildMonthOptions(0);
                } else if (chosenYear < currentYear) {
                    buildMonthOptions(chosenYear, 12);
                } else {
                    buildMonthOptions(chosenYear, currentMonth);
                }
            });

            // 提交前启用disabled的月份下拉框，确保值被提交
            $('form').on('submit', function() {
                $('#searchMonth').prop('disabled', false);
            });

            $('#jobName').on('keypress', function(e) {
                if (e.which == 13) {
                    $(this).closest('form').submit();
                }
            });
            $('[title]').tooltip();
        });
    </script>
</body>

</html>
